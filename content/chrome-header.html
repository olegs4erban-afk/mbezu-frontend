<!-- MBezu · chrome-header · брендовая шапка для нативных страниц Tilda (товар, статьи, посадочные).
     На страницах витрины (body.mbezu-app) скрыта head-CSS — у них свой TopBar. -->
<link rel="stylesheet" href="https://cdn.mbezu.ru/e/style.css">
<header class="mbezu-chrome" style="background:var(--bg,#ede5d6);color:var(--ink,#2a2520);border-bottom:1px solid var(--rule-soft,rgba(42,37,32,.1))">
  <div style="max-width:1480px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px">
    <a href="/" class="display" style="font-size:26px;font-weight:500;font-style:italic;letter-spacing:-.02em;color:inherit;text-decoration:none;padding:8px 0">MBezu</a>
    <nav aria-label="Основная навигация" class="hide-mobile" style="display:flex;gap:28px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:500">
      <a href="/catalog" class="uh" style="color:inherit;text-decoration:none;padding:10px 0">Каталог</a>
      <a href="/commission" class="uh" style="color:inherit;text-decoration:none;padding:10px 0">На заказ</a>
      <a href="/podarok" class="uh" style="color:inherit;text-decoration:none;padding:10px 0">В подарок</a>
      <a href="/journal" class="uh" style="color:inherit;text-decoration:none;padding:10px 0">Журнал</a>
      <a href="/about" class="uh" style="color:inherit;text-decoration:none;padding:10px 0">Художник</a>
    </nav>
    <a href="/cart" onclick="if(typeof tcart__openCart==='function'){event.preventDefault();tcart__openCart();}" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--accent,#6f5c2b);border-radius:999px;color:var(--accent,#6f5c2b);text-decoration:none;font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:500">Корзина</a>
  </div>
</header>
